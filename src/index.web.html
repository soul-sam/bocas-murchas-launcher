<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover: no celular o app ocupa a tela toda, inclusive atras
      do notch e da barra de gestos. Quem compensa e o layout, com
      env(safe-area-inset-*).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta name="color-scheme" content="dark" />

    <!--
      CSP: mesma do index.html do Electron, com UMA diferenca que importa —
      `connect-src` ganha o proprio dominio implicitamente por 'self', mas
      aqui 'self' e https://bocasmurchas.com.br, e nao o app://. Manter a
      lista explicita evita a mesma armadilha de la: o WebSocket do LiveKit
      bloqueado ANTES de sair da maquina, com erro de ~1ms e sem mensagem,
      parecendo que "entrar na call nao faz nada".

      ATENCAO: se o LIVEKIT_URL do servidor mudar de host, este valor muda
      junto — o CSP e estatico e nao enxerga o que a API devolve em
      /api/livekit/config.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://api.bocasmurchas.com.br wss://api.bocasmurchas.com.br https://live.bewhale.com.br wss://live.bewhale.com.br https://crafatar.com https://www.youtube.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: https: http://localhost:* http://127.0.0.1:*; frame-src https://www.youtube-nocookie.com https://www.youtube.com;"
    />

    <!--
      PWA: e por aqui que o app vira icone na tela inicial do celular, no
      Android e no iPhone. O iOS ignora o manifesto pro icone e pra tela de
      abertura — por isso os apple-* logo abaixo.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/clover.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bocas" />
    <meta name="application-name" content="Bocas Murchas" />

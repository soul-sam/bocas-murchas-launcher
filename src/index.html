<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      connect-src precisa listar o servidor de LiveKit (live.bewhale.com.br),
      senão o WebSocket da chamada de voz é bloqueado AQUI, antes de sair da
      máquina: o erro chega em ~1ms, sem status e sem mensagem, e parece que
      "entrar na call simplesmente não faz nada".

      ATENÇÃO: se o LIVEKIT_URL do servidor mudar de host, este valor tem que
      mudar junto — o CSP é estático e não enxerga o que a API devolve em
      /api/livekit/config.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* https://api.bocasmurchas.com.br wss://api.bocasmurchas.com.br https://live.bewhale.com.br wss://live.bewhale.com.br https://api.minecraftservices.com https://crafatar.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Bocas Murchas Launcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

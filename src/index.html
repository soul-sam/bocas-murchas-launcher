<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      connect-src precisa listar o servidor de LiveKit (live.bewhale.com.br),
      senão o WebSocket da chamada de voz é bloqueado AQUI, antes de sair da
      máquina: o erro chega em ~1ms, sem status e sem mensagem, e parece que
      "entrar na call simplesmente não faz nada".

      ATENÇÃO: se o LIVEKIT_URL do servidor mudar de host, este valor tem que
      mudar junto — o CSP é estático e não enxerga o que a API devolve em
      /api/livekit/config.
    -->
    <!--
      img-src/media-src incluem http://localhost:* por causa do
      desenvolvimento: rodando contra a API local, avatar, print e anexo saem
      de http://localhost:3011 e eram bloqueados AQUI — o que fazia toda imagem
      aparecer quebrada em dev e ninguém entender por quê. Não afrouxa nada em
      produção: `https:` (qualquer host) já estava liberado, então somar a
      máquina local não amplia o que uma mensagem consegue carregar.
    -->
    <!--
      frame-src é pro "assistir junto": o player do YouTube é um <iframe> e,
      sem frame-src, cai no default-src 'self' e o palco fica um retângulo
      preto sem erro nenhum no console do app. youtube-nocookie.com é o que
      usamos (não grava cookie de rastreamento); youtube.com entra porque o
      player redireciona pra lá em alguns vídeos (idade, embed restrito).
      Controlamos o player por postMessage, então script-src continua 'self'
      — o SDK oficial do YouTube NÃO roda aqui, de propósito.

      connect-src ganha https://www.youtube.com só pelo oEmbed, que é como
      descobrimos o título do vídeo sem chave de API.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:* https://api.bocasmurchas.com.br wss://api.bocasmurchas.com.br https://live.bewhale.com.br wss://live.bewhale.com.br https://api.minecraftservices.com https://crafatar.com https://www.youtube.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; media-src 'self' blob: https: http://localhost:* http://127.0.0.1:*; frame-src https://www.youtube-nocookie.com https://www.youtube.com;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <title>Bocas Murchas Launcher</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>

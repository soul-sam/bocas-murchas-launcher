appId: gg.bocasmurchas.launcher
productName: Bocas Murchas Launcher
copyright: Copyright © 2026 Bocas Murchas
artifactName: Bocas-Murchas-Launcher-Setup-${version}.${ext}

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/*.{md,map,d.ts}"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,LICENSE,license}"
  - "!**/node_modules/*/{test,tests,docs,examples}/**"

# O icone da bandeja e carregado em runtime de process.resourcesPath; sem isso
# ele nao existe no app empacotado e a bandeja aparece sem imagem.
extraResources:
  - from: build/icon.ico
    to: icon.ico

asar: true
asarUnpack:
  - "**/node_modules/extract-zip/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # publisherName foi REMOVIDO de proposito.
  #
  # O electron-updater usa esse valor pra conferir a assinatura do instalador
  # baixado (Get-AuthenticodeSignature no Windows). Como nao temos certificado,
  # o arquivo sai sem assinatura, a conferencia nunca bate e a atualizacao e
  # RECUSADA em silencio — o usuario baixa o update e ele simplesmente nao
  # aplica.
  #
  # Sem publisherName, o updater pula essa conferencia e a atualizacao funciona.
  # Quando comprarem um certificado de code signing, e so voltar a linha
  # (com o nome EXATO do titular do certificado) que a verificacao passa a
  # valer de verdade.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bocas Murchas
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: Bocas Murchas Launcher
  artifactName: Bocas-Murchas-Launcher-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false

publish:
  provider: github
  owner: soul-sam
  repo: bocas-murchas-launcher
  releaseType: release

server {
  listen 80;

  # `_` (curinga) e nao o dominio: este nginx roda DENTRO do container, atras
  # do nginx do host. Quem decide o dominio e o proxy de fora; se ele repassar
  # a requisicao com outro Host (nome do container, 127.0.0.1:porta), um
  # server_name fixo nao casa e o site cai no server default — 404 em tudo.
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ============================================
  # PROVA DE QUE O APP E DESTE SITE
  # ============================================
  # O Android so esconde a barra de endereco do APK (TWA) se achar ESTE arquivo
  # aqui, como JSON de verdade. A pegadinha: o `location /` abaixo devolve
  # index.html pra qualquer caminho desconhecido, entao um assetlinks faltando
  # nao da 404 — da 200 com HTML dentro, e a verificacao falha CALADA, com o
  # app abrindo numa aba do Chrome com barra e tudo. `=404` no try_files pra
  # falhar barulhento.
  #
  # `always` no Cache-Control: o navegador do Android cacheia isso, e trocar a
  # chave de assinatura com um assetlinks velho em cache e um dia perdido.
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
  }

  # ============================================
  # O APK
  # ============================================
  # Diretorio PROPRIO (/srv/apk), fora da raiz do site. Duas razoes:
  #
  #   1. o APK e publicado por outro workflow, em outra hora — se morasse
  #      dentro do site, publicar o site apagaria o APK e o link que a galera
  #      tem no grupo morreria sem ninguem entender por que;
  #   2. montar um volume DENTRO de outro que e somente-leitura exige criar o
  #      ponto de montagem la dentro, o que o Docker nao consegue fazer.
  #
  # `^~` e obrigatorio aqui: sem ele, a regra de extensao la embaixo (que e
  # regex, e regex ganha de prefixo no nginx) pegaria o .apk primeiro e
  # procuraria o arquivo na raiz do site — 404 garantido.
  #
  # Sem o tipo certo o Android nao oferece instalar: o navegador baixa como
  # arquivo generico e o toque no download nao faz nada.
  location ^~ /app/ {
    alias /srv/apk/;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment" always;
    # Sem cache longo: a graca e mandar o link no grupo e todo mundo pegar a
    # versao nova. Um APK de 30 dias em cache e suporte tecnico garantido.
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # ============================================
  # PWA
  # ============================================
  # Service worker e manifesto NUNCA podem ficar presos no cache: o sw.js e o
  # que decide quando o app atualiza — se ele proprio ficar 30 dias em cache
  # (regra dos .js la embaixo), ninguem recebe versao nova.
  location = /sw.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    types { }
    default_type application/javascript;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, must-revalidate" always;
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
  }

  # ============================================
  # O APP
  # ============================================
  # Regra de asset ANTES do fallback do SPA: o app usa BrowserRouter agora
  # (nao mais hash), entao `/impressao` tem que devolver index.html, mas
  # `/assets/main-abc123.js` que nao existe tem que dar 404 — e nao um
  # index.html com Content-Type de javascript, que quebra o modulo com um
  # "Unexpected token '<'" impossivel de ler.
  location ~* \.(?:css|js|mjs|map|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
